const typeColors = {"Entity": "#6510F4", "EntityType": "#A550FF", "DocumentChunk": "#0DFF00", "TextDocument": "#FF6B35", "TextSummary": "#FFD700"};
const defaultColor = "#555";

// Build legend
const types = [...new Set(nodes.map(n => n.type))].sort();
const legend = d3.select("#legend");
types.forEach(t => {
  const item = legend.append("div").attr("class","legend-item");
  item.append("div").attr("class","legend-dot").style("background", typeColors[t] || defaultColor);
  item.append("span").text(t);
});

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox",[0,0,width,height]);
const g = svg.append("g");

// Zoom
svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(40).strength(0.3))
  .force("charge", d3.forceManyBody().strength(-30))
  .force("center", d3.forceCenter(width/2, height/2))
  .force("collision", d3.forceCollide().radius(8));

const link = g.append("g").selectAll("line").data(links).join("line")
  .attr("stroke","rgba(255,255,255,0.08)").attr("stroke-width",0.5);

const node = g.append("g").selectAll("circle").data(nodes).join("circle")
  .attr("r", d => d.type === "DocumentChunk" ? 3 : d.type === "EntityType" ? 5 : 4)
  .attr("fill", d => typeColors[d.type] || defaultColor)
  .attr("stroke","rgba(255,255,255,0.1)").attr("stroke-width",0.5)
  .call(d3.drag().on("start",dragstart).on("drag",dragged).on("end",dragend));

const tooltip = d3.select("#tooltip");
node.on("mouseover",(e,d) => {
  tooltip.style("opacity",1).html(`<b>${d.name}</b><br><span style="color:#aaa">${d.type}</span>`);
  d3.select(e.target).attr("r", 10).attr("stroke","#fff").attr("stroke-width",2);
}).on("mousemove",(e) => {
  tooltip.style("left",(e.clientX+12)+"px").style("top",(e.clientY-20)+"px");
}).on("mouseout",(e,d) => {
  tooltip.style("opacity",0);
  d3.select(e.target).attr("r", d.type==="DocumentChunk"?3:d.type==="EntityType"?5:4)
    .attr("stroke","rgba(255,255,255,0.1)").attr("stroke-width",0.5);
});

simulation.on("tick", () => {
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("cx",d=>d.x).attr("cy",d=>d.y);
});

// Search
d3.select("#searchInput").on("input", function() {
  const q = this.value.toLowerCase();
  node.attr("opacity", d => !q || d.name.toLowerCase().includes(q) ? 1 : 0.05);
  link.attr("opacity", !q ? 1 : 0.02);
});

function dragstart(e,d) { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; }
function dragged(e,d) { d.fx=e.x; d.fy=e.y; }
function dragend(e,d) { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }
</script>
</body>
</html>
